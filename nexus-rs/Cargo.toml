[workspace]
resolver = "3"
members = ["crates/nexus-core", "crates/nexus"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/GameBitBan/Nexus"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fastrand = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
