[package]
name = "nexus"
description = "Nexus — a music player for your own lossless library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

build = "build.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[features]
# FFmpeg built from source and linked in (with libopus): a Linux binary that runs on any distro.
# Used for the release zip; normal builds use the system's FFmpeg.
static-ffmpeg = ["ffmpeg-next/build", "ffmpeg-next/build-lib-opus"]

[dependencies]
nexus-core = { path = "../nexus-core" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
fastrand.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "links", "accesskit"] }
egui = "0.37"
fontdb = "0.24"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
open = "5"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
realfft = "3"
ffmpeg-next = "9"
ctrlc = { version = "3", features = ["termination"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
base64 = "0.22"
sha2 = "0.10"


[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
