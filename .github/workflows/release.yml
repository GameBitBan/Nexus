# bump VERSION in nexus.py and push to main (or push a tag like v1.11.0, or run it by hand)
# → builds nexus.zip and publishes a GitHub Release tagged v<VERSION>. pushes that don't change the
# version are skipped. Nexus checks this repo's latest release for updates; install.ps1 installs from it.
name: release

on:
  push:
    branches: [main]
    paths: ["nexus.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: check version
        id: v
        run: |
          VERSION=$(grep -m1 '^VERSION = ' nexus.py | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match VERSION = \"$VERSION\" in nexus.py"; exit 1
          fi
          python3 -m py_compile nexus.py Nexus.pyw "Install Nexus.pyw"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released — nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: build nexus.zip
        if: steps.v.outputs.skip != '1'
        run: |
          mkdir -p dist/Nexus
          cp -r nexus.py Nexus.pyw "Install Nexus.pyw" install.ps1 requirements.txt README.md LICENSE \
                PRIVACY.md SECURITY.md CODE_SIGNING.md installer.iss \
                flake.nix nexus.desktop run.sh build_exe.py make_icon.py make_skins.py fonts icons skins dist/Nexus/
          # releases know where they came from, so the app updates from this repo
          sed -i "s|^GITHUB_REPO = \"\"|GITHUB_REPO = \"${GITHUB_REPOSITORY}\"|" dist/Nexus/nexus.py
          find dist -name __pycache__ -prune -exec rm -rf {} +
          (cd dist && zip -qr nexus.zip Nexus)
          sha256sum dist/nexus.zip

      - name: publish release
        if: steps.v.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nexus ${{ steps.v.outputs.version }}
          files: dist/nexus.zip
          generate_release_notes: true

  # the Windows app + installer (NexusSetup.exe), attached to the same release.
  # unsigned until a code-signing certificate is set up (see CODE_SIGNING.md) — Smart App Control blocks unsigned
  # exes, so install.ps1 / "Install Nexus.pyw" stay the default way to install until then.
  windows:
    needs: release
    if: needs.release.outputs.skip != '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: build Nexus.exe
        shell: bash
        run: |
          sed -i "s|^GITHUB_REPO = \"\"|GITHUB_REPO = \"${GITHUB_REPOSITORY}\"|" nexus.py
          python build_exe.py

      - name: self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Nexus\Nexus.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: build NexusSetup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=${{ needs.release.outputs.version }} installer.iss
          Get-FileHash dist\NexusSetup.exe -Algorithm SHA256

      # code signing goes here once a certificate exists (SignPath or Azure Artifact Signing), signing
      # dist\Nexus\Nexus.exe before the installer step and dist\NexusSetup.exe after it.

      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: dist/NexusSetup.exe

