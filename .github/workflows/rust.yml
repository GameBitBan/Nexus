# Nexus 2 (Rust): build + test on every push to the rust branch.
#  - nix: the flake builds, its tests pass, and the packaged app passes --selftest (NixOS install path)
#  - linux: cargo test + clippy against Ubuntu's libraries
#  - windows: release build with FFmpeg's shared libraries, --selftest, the installer and a zip ready to try
#  - linux-static: the release's Linux zip (FFmpeg linked in), --selftest
name: rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix build (builds, runs nexus-core tests, runs --selftest)
        run: nix build .#nexus -L
      - name: selftest report
        run: |
          HOME=$RUNNER_TEMP NEXUS_HOME=$RUNNER_TEMP/nx ./result/bin/nexus --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - name: flake check
        run: nix flake check -L --no-build

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-rs
    steps:
      - uses: actions/checkout@v4
      - name: libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config clang libclang-dev libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus-rs
      - run: cargo test -p nexus-core
      - run: cargo clippy --workspace -- -D clippy::correctness
      - run: cargo build -p nexus
      - run: ./target/debug/nexus --selftest selftest.txt; cat selftest.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus-rs
      - name: FFmpeg (shared libraries + headers)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest release branch the Rust bindings know (ffmpeg-sys-next 9: up to FFmpeg 8.1)
          $assets = gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' |
            Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-shared-\d+\.\d+\.zip$' -and ([version]"$($Matches[1]).$($Matches[2])" -le [version]"8.1") }
          $pick = $assets | Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+).*','$1') } | Select-Object -Last 1
          if (-not $pick) { throw "no FFmpeg build found: $($assets -join ', ')" }
          Write-Host "using $pick"
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern $pick --output ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $dir = (Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: build
        working-directory: nexus-rs
        run: cargo build --release -p nexus
      - name: package
        shell: pwsh
        run: |
          $d = "dist\Nexus"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item nexus-rs\target\release\nexus.exe "$d\Nexus.exe"
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $d
          Copy-Item -Recurse fonts, icons, skins $d
          Copy-Item LICENSE, README.md, PRIVACY.md $d
      - name: selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Nexus\Nexus.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: installer + zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=2.0.0 nexus-rs\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Compress-Archive dist\Nexus dist\nexus2-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nexus2-windows-x64
          path: |
            dist/nexus2-setup-x64.exe
            dist/nexus2-windows-x64.zip

  # the release's Linux zip: FFmpeg built from source and linked in, so it runs on any distro
  linux-static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config clang libclang-dev nasm libopus-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus-rs
          key: release-static
      - name: build (FFmpeg built in)
        working-directory: nexus-rs
        run: cargo build --release -p nexus --features static-ffmpeg
      - name: package + self-test
        run: |
          ldd nexus-rs/target/release/nexus
          if ldd nexus-rs/target/release/nexus | grep -E 'libav(codec|format|util)'; then echo "::error::FFmpeg isn't linked in"; exit 1; fi
          mkdir -p dist/Nexus
          cp nexus-rs/target/release/nexus dist/Nexus/
          cp -r fonts icons skins nexus.desktop LICENSE README.md PRIVACY.md dist/Nexus/
          (cd dist && zip -qr nexus2-linux-x86_64.zip Nexus)
          HOME=$RUNNER_TEMP NEXUS_HOME=$RUNNER_TEMP/nx ./dist/Nexus/nexus --selftest selftest.txt || (cat selftest.txt; exit 1)
          cat selftest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus2-linux-x86_64
          path: dist/nexus2-linux-x86_64.zip
